name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Formatting and evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Evaluate flake
        run: nix flake check --no-build
      # flake check skips darwinConfigurations, and evaluation needs no macOS runner.
      - name: Evaluate nix-darwin
        run: nix eval --raw .#darwinConfigurations.macbook.system.drvPath
