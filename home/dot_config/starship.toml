# A compact, information-dense prompt that stays legible in narrow terminals.
add_newline = false
command_timeout = 1_000

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$status\
$character"""

right_format = """$nix_shell$python$nodejs$rust$golang$java"""

[fill]
symbol = " "

[directory]
style = "bold #83a598"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "󰋜 ~"
read_only = " 󰌾"
read_only_style = "#fb4934"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold #d79921"
truncation_length = 30
truncation_symbol = "…"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #fb4934"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[cmd_duration]
min_time = 2_000
style = "#928374"
format = "[󰔛 $duration]($style)"

[status]
disabled = false
symbol = "✘ "
style = "bold #fb4934"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"
vimcmd_symbol = "[❮](bold #83a598)"

[nix_shell]
symbol = " "
style = "bold #83a598"
format = "[$symbol$state( \\($name\\))]($style) "

[python]
symbol = " "
style = "bold #b8bb26"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold #b8bb26"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold #fe8019"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #83a598"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold #fb4934"
format = "[$symbol($version )]($style)"
